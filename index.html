<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Una sorpresa especial para Andrés!</title>
    <!-- Librería para el efecto de confeti alegre -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 100%;
            transition: all 0.4s ease;
        }

        .title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .dino-container {
            font-size: 90px;
            cursor: pointer;
            user-select: none;
            margin: 15px 0;
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 2.5s ease-in-out infinite;
        }

        .dino-container:hover {
            transform: scale(1.18) rotate(6deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .btn {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background: linear-gradient(45deg, #059669, #047857);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        #mensaje-container {
            display: none;
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #mensaje-container.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .mensaje-broma {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff4757, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .mensaje-amor {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b81, #ff4757, #ed4c67);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .dino-celebrate {
            font-size: 100px;
            animation: bounce 0.6s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0) rotate(-5deg); }
            to { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="intro-card">
        <div class="title">🦖 ¡Un dinosaurio tiene un mensaje especial para ti!</div>
        
        <div class="dino-container" id="dino" onclick="revelarMensaje()">
            🦖
        </div>

        <br>
        <button class="btn" onclick="revelarMensaje()">Toca al dinosaurio 🦕</button>
    </div>

    <div class="card" id="mensaje-container">
        <div class="dino-celebrate">🦖</div>
        <div class="mensaje-broma">¡Hola Andrés eres un tonto AJJAJJ!</div>
        <div class="mensaje-amor">Pero te quiero mucho ❤️</div>
    </div>

    <script>
        function lanzarConfeti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        function revelarMensaje() {
            const introCard = document.getElementById('intro-card');
            const mensajeContainer = document.getElementById('mensaje-container');

            // Ocultar tarjeta principal
            introCard.style.display = 'none';

            // Mostrar el mensaje con animación y confeti
            mensajeContainer.classList.add('show');
            lanzarConfeti();
        }
    </script>
</body>
</html>
